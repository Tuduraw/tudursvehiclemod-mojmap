# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric toolchain (Mojang official mappings - see MOJMAP.md)
minecraft_version=1.21.11
loader_version=0.18.2

loom_version=1.14-SNAPSHOT

# Mod properties
mod_version=1.1.1
maven_group=com.example.tudursvehiclemod
